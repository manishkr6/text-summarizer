[project]
name = "text-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manishkr6", email = "manishkr8927@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.108",
    "datasets>=5.1.0",
    "ensure==1.0.2",
    "fastapi==0.78.0",
    "jinja2==3.1.2",
    "matplotlib>=3.11.2",
    "mypy-boto3-s3>=1.43.106",
    "nltk>=3.10.3",
    "notebook>=7.6.3",
    "pandas>=3.0.6",
    "py7zr>=1.1.3",
    "python-box==6.0.2",
    "pyyaml>=6.0.3",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers[sentencepiece]>=5.19.0",
    "uvicorn==0.18.3",
]

[project.scripts]
text-summarizer = "text_summarizer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
